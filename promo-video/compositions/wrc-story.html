    <script>window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const scenes = [
        { id:"#s1", start:0, end:5.5, cap:"#cap1" }, { id:"#s2", start:5.5, end:12, cap:"#cap2" },
        { id:"#s3", start:12, end:18, cap:"#cap3" }, { id:"#s4", start:18, end:24, cap:"#cap4" },
        { id:"#s5", start:24, end:30, cap:"#cap5" }, { id:"#s6", start:30, end:36, cap:"#cap6" }
      ];
      scenes.forEach((s, i) => {
        const start = s.start;
        const scene = document.querySelector(s.id);
        tl.to(scene, { opacity:1, duration:0.72, ease:"power2.out" }, start);
        const end = s.end;
        if (i < scenes.length - 1) tl.to(scene, { opacity:0, duration:0.72, ease:"sine.inOut" }, end - 0.72);
        tl.from(scene.querySelector(".topline"), { y:-25, opacity:0, duration:0.48, ease:"power3.out" }, start + 0.16);
        const title = scene.querySelector(".hero-title, .scene-title h2");
        if (title) tl.from(title, { y:42, opacity:0, duration:0.62, ease:"expo.out" }, start + 0.24);
        const kicker = scene.querySelector(".kicker");
        if (kicker) tl.from(kicker, { x:-28, opacity:0, duration:0.48, ease:"power3.out" }, start + 0.32);
        const body = scene.querySelector(".hero-sub, .scene-title p");
        if (body) tl.from(body, { y:22, opacity:0, duration:0.5, ease:"sine.out" }, start + 0.5);
        const card = scene.querySelector(".phone, .run-card, .challenge-card, .social-stack, .cta, .outro-wordmark");
        if (card) tl.from(card, { y:48, scale:0.97, opacity:0, duration:0.62, ease:"back.out(1.25)" }, start + 0.66);
        if (s.cap) tl.to(s.cap, { opacity:1, y:0, duration:0.42, ease:"power2.out" }, start + 1.12);
        const glow = scene.querySelector(".glow");
        if (glow) tl.fromTo(glow, { scale:0.94, opacity:0.7 }, { scale:1.06, opacity:1, duration:2.4, ease:"sine.inOut", yoyo:true, repeat:0 }, start + 0.3);
      });
      window.__timelines["wrc-story"] = tl;</script>
